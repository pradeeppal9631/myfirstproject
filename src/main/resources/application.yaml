
spring:
  application:
    name: myfirstproject

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      username: ${REDIS_USERNAME}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: true

    mongodb:
      uri: ${MONGODB_URI}
      database: userdb
      auto-index-creation: true

server:
  port: ${PORT:8081}
  servlet:
    context-path: /api